<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Crossmate" />
<meta name="theme-color" content="#f6f3ec" />
<title>Crossmate</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"
        integrity="sha384-tMH8h3BGESGckSAVGZ82T9n90ztNXxvdwvdM6UoR56cYcf+0iGXBliJ29D+wZ/x8"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"
        integrity="sha384-bm7MnzvK++ykSwVJ2tynSE5TRdN+xL418osEVF2DE/L/gfWHj91J2Sphe582B1Bh"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"
        integrity="sha384-1qlE7MZPM2pHD/pBZCU/yB8UCP52RYL8bge/qNdfNBCWToySp8/M+JL2waXU4hjJ"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============================================================
   THEME TOKENS - light "newsprint" crossword feel, indigo accent.
   All colors live here so re-skinning is one place (starter spec).
   ============================================================ */
:root{
  --paper:#f6f3ec;          /* page background, warm paper */
  --surface:#ffffff;        /* cards / inputs */
  --surface-2:#f0ece1;      /* raised / hover */
  --ink:#1b1b1e;            /* primary text, near-black */
  --ink-2:#3d3d42;          /* secondary text */
  --muted:#74726c;          /* hints */
  --line:#e4dfd2;           /* hairline */
  --line-2:#d3ccbb;         /* visible border */
  --accent:#3358d4;         /* indigo - primary action */
  --accent-ink:#ffffff;
  --accent-soft:#e6ebfb;    /* accent tint */
  --warm:#e0764a;           /* secondary warm accent */
  --good:#2f9e5f;
  --bad:#cf4a3a;
  --grid-black:#15140f;     /* crossword block */
  --shadow:0 1px 2px rgba(20,18,12,.06),0 6px 20px rgba(20,18,12,.06);
  --radius:14px;
  --radius-sm:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Outfit",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3{font-family:"Fraunces",Georgia,serif; font-weight:600; line-height:1.15; margin:0;}
button{font-family:inherit;}
input,textarea{font-family:inherit; font-size:16px;}
.app{max-width:640px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}

/* ---- top bar ---- */
.topbar{position:sticky; top:0; z-index:20; background:var(--paper);
  display:flex; align-items:center; gap:10px; padding:14px 16px 10px;
  border-bottom:1px solid var(--line); padding-top:calc(14px + env(safe-area-inset-top));}
.brand{display:flex; align-items:center; gap:9px; font-family:"Fraunces",serif;
  font-weight:700; font-size:22px; letter-spacing:.2px;}
.brand .mark{flex:0 0 auto;}
.spacer{flex:1;}
.syncdot{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px;}
.syncdot i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;}
.syncdot.ok i{background:var(--good);}
.syncdot.pending i{background:var(--warm);}
.syncdot.err i{background:var(--bad);}
.iconbtn{border:1px solid var(--line-2); background:var(--surface); color:var(--ink-2);
  width:38px;height:38px;border-radius:50%; font-size:16px; cursor:pointer; display:flex;align-items:center;justify-content:center;}

/* ---- content ---- */
.main{flex:1; padding:16px; padding-bottom:96px;}
.screen-title{font-size:26px; margin:4px 2px 14px;}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px; box-shadow:var(--shadow); margin-bottom:12px;}
.card h3{font-size:18px; margin-bottom:8px;}
.row{display:flex; align-items:center; gap:10px;}
.muted{color:var(--muted);}
.hint{color:var(--muted); font-size:13.5px;}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);}
.pill.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent;}
.byline{font-size:12.5px;color:var(--muted);}

/* ---- buttons ---- */
.btn{appearance:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  padding:11px 16px;border-radius:var(--radius-sm);font-weight:600;font-size:15px;cursor:pointer;
  transition:transform .04s ease, background .15s ease; display:inline-flex;align-items:center;gap:8px;justify-content:center;}
.btn:active{transform:translateY(1px);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.btn.warm{background:var(--warm);border-color:var(--warm);color:#fff;}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-left:6px;padding-right:6px;}
.btn.sm{padding:7px 11px;font-size:13.5px;border-radius:9px;}
.btn.block{display:flex;width:100%;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.field{width:100%;padding:12px 13px;border:1px solid var(--line-2);border-radius:var(--radius-sm);
  background:var(--surface);color:var(--ink);margin-top:6px;}
.field:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);}
label.lbl{font-size:13px;font-weight:600;color:var(--ink-2);}

/* ---- bottom nav ---- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--surface);border-top:1px solid var(--line);
  display:flex;max-width:640px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom);}
.nav button{flex:1;background:none;border:none;padding:9px 4px 10px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600;}
.nav button.active{color:var(--accent);}
.nav .ni{font-size:20px;line-height:1;}

/* ---- empty state ---- */
.empty{text-align:center;padding:36px 18px;color:var(--muted);}
.empty .big{font-size:40px;margin-bottom:10px;}

/* ---- list item ---- */
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);
  border-radius:var(--radius-sm);background:var(--surface);margin-bottom:9px;cursor:pointer;}
.item:active{background:var(--surface-2);}
.item .grow{flex:1;min-width:0;}
/* swipe-left-to-delete on user-owned list rows (portfolio standard) */
.swipe-wrap{position:relative;overflow:hidden;border-radius:var(--radius-sm);margin-bottom:9px;}
.swipe-wrap .item{margin-bottom:0;}
.swipe-del{position:absolute;top:0;right:0;bottom:0;width:88px;border:none;background:var(--bad);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;cursor:pointer;}
.swipe-del svg{width:18px;height:18px;stroke:#fff;stroke-width:2;fill:none;}
.swipe-body{position:relative;background:var(--paper);touch-action:pan-y;will-change:transform;}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.avatar{width:34px;height:34px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-weight:700;color:#fff;font-size:14px;}

/* ---- banner ---- */
.banner{background:var(--accent);color:#fff;padding:10px 14px;border-radius:var(--radius-sm);
  display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:14px;}
.banner.warn{background:var(--warm);}
/* update bar (portfolio standard): full-width tappable strip above the top bar */
.update-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:var(--accent);color:#fff;border:none;text-align:left;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;font-size:13.5px;font-weight:600;cursor:pointer;}
.update-go{flex:0 0 auto;background:#fff;color:var(--accent);border-radius:999px;padding:6px 15px;font-weight:800;font-size:12.5px;}
.updrow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:4px 0 2px;}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:60;
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;box-shadow:var(--shadow);}

/* ---- auth ---- */
.auth-wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;
  max-width:400px;margin:0 auto;padding:24px;}
.auth-logo{text-align:center;margin-bottom:22px;}
.auth-logo .name{font-family:"Fraunces",serif;font-weight:700;font-size:34px;margin-top:10px;}
.auth-logo .tag{color:var(--muted);font-size:14.5px;margin-top:4px;}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;margin-bottom:16px;}
.seg button{flex:1;border:none;background:none;padding:8px;border-radius:999px;font-weight:600;color:var(--muted);cursor:pointer;font-size:14px;}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}
.err{color:var(--bad);font-size:13.5px;margin-top:8px;}
.ok{color:var(--good);font-size:13.5px;margin-top:8px;}
.diag{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:10px;padding:10px;max-height:300px;overflow:auto;white-space:pre-wrap;}
.grid-preview{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;width:120px;margin:0 auto;}
.grid-preview i{aspect-ratio:1;background:var(--surface);border:1px solid var(--line-2);border-radius:2px;}
.grid-preview i.blk{background:var(--grid-black);border-color:var(--grid-black);}

/* ---- solver (full-screen crossword) ---- */
.solver{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column;max-width:640px;margin:0 auto;}
.solver-top{display:flex;align-items:center;gap:8px;padding:12px 12px;border-bottom:1px solid var(--line);padding-top:calc(12px + env(safe-area-inset-top));}
.solver-top .ttl{font-family:"Fraunces",serif;font-weight:600;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.solver-mid{flex:1;overflow:auto;padding:14px 12px 10px;}
.xgrid{display:grid;gap:1.5px;width:min(94vw,448px);margin:4px auto 2px;background:var(--grid-black);border:2.5px solid var(--grid-black);border-radius:7px;overflow:hidden;box-shadow:0 6px 22px rgba(20,18,12,.14);}
.xcell{position:relative;aspect-ratio:1;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:clamp(15px,5.8vw,29px);cursor:pointer;user-select:none;color:var(--ink);text-transform:uppercase;transition:background .08s ease;}
.xcell.block{background:var(--grid-black);cursor:default;}
.xcell.hl{background:#fdf0be;}            /* active word - pale gold (familiar crossword highlight) */
.xcell.sel{background:#f5c93a;}           /* active cell - gold */
.xcell.wrong{color:var(--bad);}
.xcell.wrong::after{content:"";position:absolute;top:2px;right:2px;width:0;height:0;border-top:9px solid var(--bad);border-left:9px solid transparent;}
.xcell .n{position:absolute;top:2px;left:3px;font-size:9.5px;font-weight:700;color:var(--ink-2);line-height:1;}
.cluebar{display:flex;align-items:center;gap:6px;padding:13px 8px;background:var(--surface);border-top:1px solid var(--line-2);box-shadow:0 -3px 12px rgba(20,18,12,.05);cursor:pointer;}
.cluebar .cnum{font-weight:800;color:var(--accent);white-space:nowrap;font-size:15px;padding-left:4px;}
.cluebar .ctext{flex:1;font-size:16px;min-width:0;font-weight:500;line-height:1.3;}
.cluebar .arw{border:none;background:var(--surface-2);border-radius:8px;font-size:20px;color:var(--ink-2);cursor:pointer;padding:4px 10px;line-height:1;}
.kbd{padding:7px 4px calc(7px + env(safe-area-inset-bottom));background:var(--surface-2);}
.kbd-row{display:flex;gap:5px;justify-content:center;margin:4px 0;}
.kbd-key{flex:1;max-width:37px;height:48px;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;font-weight:600;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);box-shadow:0 1.5px 0 rgba(20,18,12,.14);}
.kbd-key.wide{max-width:54px;font-size:18px;}
.kbd-key:active{background:var(--surface-2);transform:translateY(1px);box-shadow:none;}
.cluelist{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.cluelist h4{font-family:"Outfit",sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 6px;}
.clue{display:flex;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:13.5px;line-height:1.3;}
.clue.on{background:var(--accent-soft);}
.clue .cn{font-weight:700;color:var(--ink-2);min-width:20px;}
.solved-toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:60;background:var(--good);color:#fff;
  padding:12px 20px;border-radius:999px;font-weight:600;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;}
.solved-toast button{background:rgba(255,255,255,.25);border:none;color:#fff;font-weight:700;padding:5px 12px;border-radius:999px;cursor:pointer;}
.solver-flash{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:58;background:var(--ink);color:#fff;
  padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);white-space:nowrap;}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
/* ============================================================
   CROSSMATE - co-op crossword app (Forever Apps).
   Single-file PWA: React 18 + Babel (CDN), no build step. Shares the
   MenuCaptain/Tracker shell (Supabase Auth, collections sync, fetch-based
   update check) reskinned to Crossmate and wired to crossmate-backend.
   Step 1 = shell + auth + Friends/Profile (live) + Home (games/library).
   Grid solving (Solve) and the builder (Build) arrive in Step 2.
   ============================================================ */
const { useState, useEffect, useCallback, useRef } = React;

/* ---- version + logging ---- */
const APP_VERSION = "0.3.6";
const BUILD = "2026-07-23.2";
function buildIsNewer(a, b){
  const parse = s => String(s||"").split(/[-.]/).map(n=>parseInt(n,10)||0);
  const pa=parse(a), pb=parse(b), len=Math.max(pa.length,pb.length);
  for(let i=0;i<len;i++){ const x=pa[i]||0, y=pb[i]||0; if(x>y) return true; if(x<y) return false; }
  return false;
}
const LOG_CAP = 500, LOG = [];
function log(tag, msg){
  const line = { t:new Date().toISOString().slice(11,19), tag, msg:String(msg) };
  LOG.push(line); if(LOG.length>LOG_CAP) LOG.shift();
  try{ console.log("["+tag+"] "+line.msg); }catch(e){}
}
log("INIT","Crossmate booting - v"+APP_VERSION+" (build "+BUILD+")");

/* ---- small utils ---- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const nowISO = () => new Date().toISOString();
const initials = (s) => (String(s||"?").trim()[0]||"?").toUpperCase();
function colorFor(seed){
  const cols=["#3358d4","#e0764a","#2f9e5f","#b5599e","#c7a12b","#6f63e0","#d0503f","#2f9fb0"];
  let h=0; const s=String(seed||""); for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0;
  return cols[h%cols.length];
}

/* ---- local storage cache (namespaced) ---- */
const NS = "crossmate:";
const lsGet = (k, fb) => { try{ const v=localStorage.getItem(NS+k); return v===null?fb:JSON.parse(v); }catch(e){ return fb; } };
const lsSet = (k, v) => { try{ localStorage.setItem(NS+k, JSON.stringify(v)); }catch(e){} };

/* ============================================================
   BACKEND + AUTH CONFIG
   PUBLIC-SAFE values only. The Supabase anon key permits auth, not data
   access (data flows through the backend with the user's token). The real
   secrets live only on the Railway backend.
   TODO (cloud stand-up): set these to the Crossmate Supabase project + the
   Railway backend URL. Until then the app runs in "not configured" mode.
   ============================================================ */
const SUPABASE_URL      = "https://cosxmhvsnghrbfrtysvg.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNvc3htaHZzbmdocmJmcnR5c3ZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5OTc0OTQsImV4cCI6MjA5OTU3MzQ5NH0.mjRpd2eU-4tT0XICbmRwUCM8JVEdyKnTWMu_8C_dJdI";
const API_BASE          = "https://web-production-8202f.up.railway.app";
const CONFIGURED = !SUPABASE_URL.includes("YOUR-CROSSMATE") && !API_BASE.includes("YOUR-CROSSMATE") && SUPABASE_ANON_KEY.startsWith("eyJ");

const supa = CONFIGURED ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth:{ persistSession:true, autoRefreshToken:true, storage:window.localStorage, storageKey:"crossmate-auth" }
}) : null;

async function authToken(){
  if(!supa) return null;
  try{ const { data } = await supa.auth.getSession(); return data.session ? data.session.access_token : null; }
  catch(e){ log("ERROR","authToken: "+e.message); return null; }
}

/* ---- generic backend call ---- */
// Fire-and-forget backend warm-up (no auth needed) - starts waking a cold Railway
// service the moment the app opens, so the first real request isn't a 40s cold start.
function warmBackend(){ try{ fetch(API_BASE + "/health", { cache:"no-store" }).catch(()=>{}); }catch(e){} }

async function api(path, opts={}){
  const token = await authToken();
  if(!token) throw new Error("Not signed in");
  const headers = Object.assign({ "Authorization":"Bearer "+token },
    opts.body ? { "Content-Type":"application/json" } : {});
  const body = opts.body ? JSON.stringify(opts.body) : undefined;
  const method = opts.method || "GET";

  // Retry on network failure / timeout (a sleeping Railway backend fails or hangs
  // the first hit, then wakes). Each attempt has a 15s timeout; up to 3 tries.
  let r = null, netErr = null;
  for(let attempt=0; attempt<3 && !r; attempt++){
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 15000);
    try{
      r = await fetch(API_BASE + path, { method, headers, body, signal: ctrl.signal });
    }catch(e){
      netErr = e; log("API", "attempt "+(attempt+1)+" failed "+method+" "+path+" ("+e.message+")");
      if(attempt < 2) await new Promise(res=>setTimeout(res, 2000));   // backend waking - wait + retry
    }finally{ clearTimeout(timer); }
  }
  if(!r){
    log("ERROR", method+" "+path+" all retries failed: "+(netErr && netErr.message));
    throw new Error("Server is waking up. Give it a few seconds and try again.");
  }
  if(!r.ok){
    let detail = ""; try{ const j=await r.json(); detail=j.detail||""; }catch(e){ try{ detail=await r.text(); }catch(_){} }
    log("ERROR", method+" "+path+" "+r.status+" "+String(detail).slice(0,140));
    if(r.status===401) throw new Error("Session expired - sign in again.");
    throw new Error(detail || ("Request failed ("+r.status+")"));
  }
  if(r.status===204) return null;
  return r.json();
}

/* ---- collections (per-user library + meta) ---- */
const collGet = (name) => api("/api/collection/"+name);
const collPut = (name, data) => api("/api/collection/"+name, { method:"PUT", body:data });

/* ---- Crossmate domain API ---- */
const Api = {
  profileMe:      () => api("/api/profile/me"),
  profileCheck:   (u) => api("/api/profile/check?username="+encodeURIComponent(u)),
  profileUpdate:  (username, display_name) => api("/api/profile/me", { method:"PUT", body:{ username, display_name } }),
  connections:    () => api("/api/connections"),
  connectRequest: (username) => api("/api/connections/request", { method:"POST", body:{ username } }),
  connectAccept:  (id) => api("/api/connections/"+id+"/accept", { method:"POST", body:{} }),
  connectRemove:  (id) => api("/api/connections/"+id, { method:"DELETE" }),
  puzzles:        () => api("/api/puzzles"),
  puzzle:         (id) => api("/api/puzzles/"+encodeURIComponent(id)),
  gameCreate:     (puzzle_id) => api("/api/game/create", { method:"POST", body:{ puzzle_id } }),
  gameMine:       () => api("/api/game/mine"),
  gameGet:        (code) => api("/api/game/"+code),
  gameJoin:       (code) => api("/api/game/"+code+"/join", { method:"POST", body:{} }),
  gameInvite:     (code, username) => api("/api/game/"+code+"/invite", { method:"POST", body:{ username } }),
  gameDelete:     (code) => api("/api/game/"+code, { method:"DELETE" }),
};

/* ============================================================
   LOGO MARK - tiny crossword grid (inline SVG, no asset needed)
   ============================================================ */
function Mark({size=26}){
  const cell=(x,y,blk)=> <rect x={x} y={y} width="7" height="7" rx="1.2"
    fill={blk?"var(--grid-black)":"var(--surface)"} stroke="var(--line-2)" strokeWidth="0.8" />;
  return (
    <svg width={size} height={size} viewBox="0 0 25 25" className="mark" aria-hidden="true">
      {cell(0,0,false)}{cell(9,0,true)}{cell(18,0,false)}
      {cell(0,9,true)}{cell(9,9,false)}{cell(18,9,false)}
      {cell(0,18,false)}{cell(9,18,false)}{cell(18,18,true)}
    </svg>
  );
}

/* ============================================================
   STORE - auth + sync + domain data. Mirrors Tracker's store hook,
   trimmed to Crossmate (library collection + games + connections + profile).
   ============================================================ */
function useStore(){
  const [authed,setAuthed] = useState(false);
  const [authEmail,setAuthEmail] = useState("");
  const [authUserId,setAuthUserId] = useState("");
  const [authReady,setAuthReady] = useState(false);
  const [online,setOnline] = useState(navigator.onLine);
  const [sync,setSync] = useState("idle");        // idle|syncing|ok|pending|err
  const [profile,setProfile] = useState(lsGet("profile", null));
  const authedRef = useRef(false);

  useEffect(()=>{
    const on=()=>setOnline(true), off=()=>setOnline(false);
    window.addEventListener("online",on); window.addEventListener("offline",off);
    return ()=>{ window.removeEventListener("online",on); window.removeEventListener("offline",off); };
  },[]);

  // auth bootstrap
  useEffect(()=>{
    if(!supa){ setAuthReady(true); return; }
    let sub;
    (async()=>{
      try{
        const { data } = await supa.auth.getSession();
        const s = data.session;
        setAuthed(!!s); authedRef.current=!!s;
        setAuthEmail(s ? (s.user.email||"") : "");
        setAuthUserId(s ? (s.user.id||"") : "");
      }catch(e){ log("ERROR","getSession: "+e.message); }
      setAuthReady(true);
      const res = supa.auth.onAuthStateChange((_ev, session)=>{
        setAuthed(!!session); authedRef.current=!!session;
        setAuthEmail(session ? (session.user.email||"") : "");
        setAuthUserId(session ? (session.user.id||"") : "");
        if(!session){ setProfile(null); lsSet("profile",null); }
      });
      sub = res.data.subscription;
    })();
    return ()=>{ try{ sub && sub.unsubscribe(); }catch(e){} };
  },[]);

  // load profile once signed in
  useEffect(()=>{
    if(!authed) return;
    (async()=>{
      try{ const p = await Api.profileMe(); setProfile(p); lsSet("profile",p); }
      catch(e){ log("ERROR","load profile: "+e.message); }
    })();
  },[authed]);

  const signIn = useCallback(async(email,password)=>{
    if(!supa) throw new Error("App is not configured yet.");
    const { error } = await supa.auth.signInWithPassword({ email:(email||"").trim(), password:password||"" });
    if(error) throw new Error(error.message);
  },[]);
  const signUp = useCallback(async(email,password)=>{
    if(!supa) throw new Error("App is not configured yet.");
    const { data, error } = await supa.auth.signUp({ email:(email||"").trim(), password:password||"" });
    if(error) throw new Error(error.message);
    return { needsConfirm: !data.session };
  },[]);
  const signOut = useCallback(async()=>{ try{ supa && await supa.auth.signOut(); }catch(e){} },[]);
  const requestReset = useCallback(async(email)=>{
    if(!supa) throw new Error("App is not configured yet.");
    const { error } = await supa.auth.resetPasswordForEmail((email||"").trim());
    if(error) throw new Error(error.message);
  },[]);

  const saveProfile = useCallback(async(username, display_name)=>{
    const p = await Api.profileUpdate(username, display_name);
    setProfile(p); lsSet("profile",p); return p;
  },[]);

  return { authed, authEmail, authUserId, authReady, online, sync, setSync, profile, setProfile,
           signIn, signUp, signOut, requestReset, saveProfile };
}

/* ============================================================
   IPUZ PARSER - normalize an ipuz puzzle into a grid + word model.
   Handles blocks ("#"/null), computes standard numbering + across/down
   words from the grid geometry, and maps clues by number.
   ============================================================ */
function parsePuzzle(data){
  if(!data || !data.dimensions) return null;
  const W = data.dimensions.width, H = data.dimensions.height;
  const G = data.puzzle || [], S = data.solution || [];
  const cellVal = (r,c) => (G[r] ? G[r][c] : null);
  const isBlock = (r,c) => { const v = cellVal(r,c); return v==="#" || v===null || v===undefined || (typeof v==="object" && v && v.cell==="#"); };
  const solAt = (r,c) => { const v = S[r] ? S[r][c] : null; if(v==null || v==="#") return ""; return String(typeof v==="object" ? (v.value||v.cell||"") : v).toUpperCase(); };

  const cells = [];
  for(let r=0;r<H;r++){ const row=[]; for(let c=0;c<W;c++){ const blk=isBlock(r,c); row.push({ r, c, block:blk, num:null, sol:blk?"":solAt(r,c) }); } cells.push(row); }

  const across=[], down=[]; let n=1;
  for(let r=0;r<H;r++) for(let c=0;c<W;c++){
    const cell=cells[r][c]; if(cell.block) continue;
    const leftBlk = c===0 || cells[r][c-1].block;
    const upBlk   = r===0 || cells[r-1][c].block;
    const rightOpen = c+1<W && !cells[r][c+1].block;
    const downOpen  = r+1<H && !cells[r+1][c].block;
    const startA = leftBlk && rightOpen, startD = upBlk && downOpen;
    if(startA || startD){
      cell.num = n;
      if(startA){ const cs=[]; let cc=c; while(cc<W && !cells[r][cc].block){ cs.push(cells[r][cc]); cc++; } across.push({num:n,dir:"A",cells:cs}); }
      if(startD){ const cs=[]; let rr=r; while(rr<H && !cells[rr][c].block){ cs.push(cells[rr][c]); rr++; } down.push({num:n,dir:"D",cells:cs}); }
      n++;
    }
  }
  const clueMap = (list)=>{ const m={}; (list||[]).forEach(it=>{
    if(Array.isArray(it)) m[it[0]] = it[1];
    else if(it && typeof it==="object") m[it.number||it.num] = it.clue||it.text||"";
  }); return m; };
  const cl = data.clues || {};
  const cA = clueMap(cl.Across || cl.across), cD = clueMap(cl.Down || cl.down);
  across.forEach(w => w.clue = cA[w.num] || "");
  down.forEach(w => w.clue = cD[w.num] || "");
  return { W, H, cells, across, down };
}
function wordAt(model, r, c, dir){
  const list = dir==="A" ? model.across : model.down;
  return list.find(w => w.cells.some(cl => cl.r===r && cl.c===c)) || null;
}

/* ============================================================
   SOLVER - the crossword grid (full-screen). Pure UI over a fill map:
   `fill` (a {"r,c":letter} object) + `onFill(r,c,letter)`. Solo mode passes
   local state; co-op (Wave B) will pass the game's shared cells + a backend
   onFill - the grid itself doesn't care where fills live.
   ============================================================ */
const KB_ROWS = ["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"];
function Solver({ model, fill, onFill, title, subtitle, onBack }){
  const firstCell = ()=>{ for(const row of model.cells) for(const cell of row) if(!cell.block) return {r:cell.r,c:cell.c}; return {r:0,c:0}; };
  const [sel,setSel] = useState(firstCell);
  const [dir,setDir] = useState("A");
  const [wrong,setWrong] = useState({});
  const [solved,setSolved] = useState(false);
  const [flash,setFlash] = useState("");
  const key = (r,c)=> r+","+c;
  const showFlash = (m)=>{ setFlash(m); setTimeout(()=>setFlash(""), 1700); };

  const curWord = wordAt(model, sel.r, sel.c, dir) || wordAt(model, sel.r, sel.c, dir==="A"?"D":"A");
  const inWord = new Set((curWord?curWord.cells:[]).map(cl=>key(cl.r,cl.c)));

  const selectCell = (r,c)=>{
    if(model.cells[r][c].block) return;
    if(sel.r===r && sel.c===c){ const o=dir==="A"?"D":"A"; if(wordAt(model,r,c,o)) setDir(o); }
    else { setSel({r,c}); if(!wordAt(model,r,c,dir)){ const o=dir==="A"?"D":"A"; if(wordAt(model,r,c,o)) setDir(o); } }
  };
  const gotoWord = (w)=>{ setDir(w.dir); const e = w.cells.find(cl=>!fill[key(cl.r,cl.c)]) || w.cells[0]; setSel({r:e.r,c:e.c}); };
  const stepWord = (delta)=>{
    const all = [...model.across, ...model.down];
    const idx = curWord ? all.findIndex(w => w.dir===curWord.dir && w.num===curWord.num) : -1;
    gotoWord(all[(idx + delta + all.length) % all.length]);
  };
  const advance = ()=>{
    if(!curWord) return;
    const idx = curWord.cells.findIndex(cl=>cl.r===sel.r && cl.c===sel.c);
    if(idx>=0 && idx+1 < curWord.cells.length){ const cl=curWord.cells[idx+1]; setSel({r:cl.r,c:cl.c}); }
    else stepWord(1);
  };
  const type = (ch)=>{ onFill(sel.r, sel.c, ch); setWrong(w=>{ const n={...w}; delete n[key(sel.r,sel.c)]; return n; }); advance(); };
  const backspace = ()=>{
    if(fill[key(sel.r,sel.c)]) onFill(sel.r, sel.c, "");
    else if(curWord){ const idx=curWord.cells.findIndex(cl=>cl.r===sel.r&&cl.c===sel.c); if(idx>0){ const cl=curWord.cells[idx-1]; setSel({r:cl.r,c:cl.c}); onFill(cl.r,cl.c,""); } }
  };
  const moveSel = (dr,dc)=>{ let r=sel.r+dr, c=sel.c+dc; while(r>=0&&r<model.H&&c>=0&&c<model.W){ if(!model.cells[r][c].block){ setSel({r,c}); setDir(dr!==0?"D":"A"); return; } r+=dr; c+=dc; } };

  const checkPuzzle = ()=>{
    const w={}; let filled=0;
    for(const row of model.cells) for(const cell of row){ if(cell.block) continue;
      const v=fill[key(cell.r,cell.c)]; if(v) filled++; if(v && v!==cell.sol) w[key(cell.r,cell.c)]=true; }
    setWrong(w);
    const n=Object.keys(w).length;
    showFlash(filled===0 ? "Fill in some letters first" : n>0 ? (n+" cell"+(n>1?"s":"")+" to fix") : "Looks good so far!");
  };
  const revealWord = ()=>{
    if(!curWord){ return; }
    curWord.cells.forEach(cl=>onFill(cl.r,cl.c,cl.sol)); setWrong({});
    showFlash("Revealed "+curWord.num+(curWord.dir==="A"?" Across":" Down"));
  };
  const revealAll  = ()=>{ for(const row of model.cells) for(const cell of row){ if(!cell.block) onFill(cell.r,cell.c,cell.sol); } setWrong({}); };

  // physical keyboard (desktop); re-bound each render so closures stay fresh
  useEffect(()=>{
    const h=(e)=>{
      if(e.metaKey||e.ctrlKey||e.altKey) return;
      if(e.key==="Backspace"){ e.preventDefault(); backspace(); }
      else if(/^[a-zA-Z]$/.test(e.key)){ e.preventDefault(); type(e.key.toUpperCase()); }
      else if(e.key==="ArrowRight"){ e.preventDefault(); moveSel(0,1); }
      else if(e.key==="ArrowLeft"){ e.preventDefault(); moveSel(0,-1); }
      else if(e.key==="ArrowUp"){ e.preventDefault(); moveSel(-1,0); }
      else if(e.key==="ArrowDown"){ e.preventDefault(); moveSel(1,0); }
      else if(e.key===" "){ e.preventDefault(); const o=dir==="A"?"D":"A"; if(wordAt(model,sel.r,sel.c,o)) setDir(o); }
    };
    window.addEventListener("keydown", h);
    return ()=>window.removeEventListener("keydown", h);
  });

  // solved detection
  useEffect(()=>{
    let done=true;
    for(const row of model.cells) for(const cell of row){ if(cell.block) continue; if((fill[key(cell.r,cell.c)]||"")!==cell.sol){ done=false; break; } }
    setSolved(done);
  },[fill]);

  return (
    <div className="solver">
      <div className="solver-top">
        <button className="btn ghost sm" onClick={onBack}>&larr; Back</button>
        <span className="ttl">{title}</span>
        <button className="btn sm" onClick={checkPuzzle}>Check</button>
        <button className="btn sm" onClick={revealWord}>Reveal</button>
      </div>

      <div className="solver-mid">
        <div className="xgrid" style={{gridTemplateColumns:"repeat("+model.W+",1fr)"}}>
          {model.cells.flat().map(cell=>{
            const k=key(cell.r,cell.c);
            if(cell.block) return <div key={k} className="xcell block" />;
            const cls = "xcell" + (inWord.has(k)?" hl":"") + ((sel.r===cell.r&&sel.c===cell.c)?" sel":"") + (wrong[k]?" wrong":"");
            return <div key={k} className={cls} onClick={()=>selectCell(cell.r,cell.c)}>
              {cell.num ? <span className="n">{cell.num}</span> : null}
              {fill[k]||""}
            </div>;
          })}
        </div>

        <div className="cluelist">
          <div>
            <h4>Across</h4>
            {model.across.map(w=>(
              <div key={"A"+w.num} className={"clue"+(curWord&&curWord.dir==="A"&&curWord.num===w.num?" on":"")} onClick={()=>gotoWord(w)}>
                <span className="cn">{w.num}</span><span>{w.clue}</span>
              </div>
            ))}
          </div>
          <div>
            <h4>Down</h4>
            {model.down.map(w=>(
              <div key={"D"+w.num} className={"clue"+(curWord&&curWord.dir==="D"&&curWord.num===w.num?" on":"")} onClick={()=>gotoWord(w)}>
                <span className="cn">{w.num}</span><span>{w.clue}</span>
              </div>
            ))}
          </div>
        </div>

        <div style={{textAlign:"center",marginTop:16}}>
          <button className="btn ghost sm" onClick={revealAll}>Reveal whole puzzle</button>
          {subtitle && <div className="byline" style={{marginTop:6}}>{subtitle}</div>}
        </div>
      </div>

      <div className="cluebar" onClick={()=>{ const o=dir==="A"?"D":"A"; if(wordAt(model,sel.r,sel.c,o)) setDir(o); }}>
        <button className="arw" onClick={(e)=>{ e.stopPropagation(); stepWord(-1); }}>&lsaquo;</button>
        <span className="cnum">{curWord ? (curWord.num + (curWord.dir==="A"?"A":"D")) : ""}</span>
        <span className="ctext">{curWord ? curWord.clue : ""}</span>
        <button className="arw" onClick={(e)=>{ e.stopPropagation(); stepWord(1); }}>&rsaquo;</button>
      </div>

      <div className="kbd">
        {KB_ROWS.map((row,i)=>(
          <div className="kbd-row" key={i}>
            {row.split("").map(ch=><button key={ch} className="kbd-key" onClick={()=>type(ch)}>{ch}</button>)}
            {i===2 && <button className="kbd-key wide" onClick={backspace}>&#9003;</button>}
          </div>
        ))}
      </div>

      {flash && !solved && <div className="solver-flash">{flash}</div>}
      {solved && <div className="solved-toast">Solved! &#127881; <button onClick={onBack}>Done</button></div>}
    </div>
  );
}

/* SoloSolve - loads a puzzle by id, holds fill locally (per-puzzle), renders Solver. */
function SoloSolve({ puzzleId, onBack }){
  // cache-first: puzzles are immutable content, so a cached copy renders instantly
  // while we revalidate in the background (fixes slow first-open on a cold backend).
  const [pz,setPz] = useState(()=> lsGet("pzdata:"+puzzleId, null));
  const [err,setErr] = useState("");
  const [fill,setFill] = useState(()=> lsGet("solo:"+puzzleId, {}));
  useEffect(()=>{ (async()=>{
    try{ const p = await Api.puzzle(puzzleId); setPz(p); lsSet("pzdata:"+puzzleId, p); }
    catch(e){ if(!lsGet("pzdata:"+puzzleId, null)) setErr(e.message); }
  })(); },[puzzleId]);
  const onFill = (r,c,ch)=> setFill(f=>{ const n={...f}; const k=r+","+c; if(ch) n[k]=ch; else delete n[k]; lsSet("solo:"+puzzleId, n); return n; });
  const model = pz ? parsePuzzle(pz.data) : null;
  if(err) return <div className="solver"><div className="solver-top"><button className="btn ghost sm" onClick={onBack}>&larr; Back</button></div><div className="empty">{err}</div></div>;
  if(!model) return <div className="solver"><div className="solver-top"><button className="btn ghost sm" onClick={onBack}>&larr; Back</button></div><div className="empty">Loading puzzle...</div></div>;
  return <Solver model={model} fill={fill} onFill={onFill}
    title={pz.title||"Puzzle"} subtitle={pz.constructor ? "by "+pz.constructor : ""} onBack={onBack} />;
}

/* ============================================================
   SWIPE ROW (portfolio standard, ported from Priority Captain)
   Swipe a row left to reveal a destructive action. Horizontal-only,
   so vertical scroll is unaffected; a swipe suppresses the row's
   open-on-tap. `label` names the action (Delete vs Leave vs Remove).
   ============================================================ */
function SwipeRow({ onAction, label, children }){
  const [dx,setDx] = useState(0);
  const st = useRef(null); const moved = useRef(false);
  function down(e){ st.current = { x:e.clientX, y:e.clientY, base:dx }; moved.current = false; try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(_){} }
  function move(e){
    if(!st.current) return;
    const ddx = e.clientX - st.current.x, ddy = e.clientY - st.current.y;
    if(Math.abs(ddx) > 8 && Math.abs(ddx) > Math.abs(ddy)) moved.current = true;
    if(moved.current){ setDx(Math.max(-96, Math.min(0, st.current.base + ddx))); }
  }
  function end(){ if(!st.current) return; st.current = null; setDx(d => { const nd = d <= -48 ? -84 : 0; if(nd===0) moved.current = false; return nd; }); }
  function clickCapture(e){ if(moved.current || dx !== 0){ e.stopPropagation(); e.preventDefault(); moved.current = false; setDx(0); } }
  return (
    <div className="swipe-wrap">
      <button className="swipe-del" onClick={(e)=>{ e.stopPropagation(); setDx(0); onAction(); }}>
        <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14" strokeLinecap="round" strokeLinejoin="round"/></svg>
        <span>{label||"Delete"}</span>
      </button>
      <div className="swipe-body" style={{ transform:"translateX("+dx+"px)", transition: st.current ? "none" : "transform .18s" }}
        onPointerDown={down} onPointerMove={move} onPointerUp={end} onPointerCancel={end} onClickCapture={clickCapture}>
        {children}
      </div>
    </div>
  );
}

/* ============================================================
   HOME - your games + start-a-game from the library
   ============================================================ */
function Home({ store, onOpenGame, onSolo, go }){
  const [games,setGames] = useState(lsGet("games",[]));
  const [puzzles,setPuzzles] = useState(lsGet("puzzles",[]));
  const [loading,setLoading] = useState(true);
  const [err,setErr] = useState("");
  const [picking,setPicking] = useState(false);

  // Plain function + run-once-on-mount. NOTE: do NOT depend on `store` here - the
  // store object is a fresh reference every render, so a [store] dep would re-run
  // this forever (the "stuck syncing" bug). Setters captured at mount are stable.
  const load = async()=>{
    setErr(""); store.setSync("syncing");
    try{
      const g = await Api.gameMine(); setGames(g.games||[]); lsSet("games",g.games||[]);
      const p = await Api.puzzles(); setPuzzles(p.puzzles||[]); lsSet("puzzles",p.puzzles||[]);
      store.setSync("ok");
    }catch(e){ setErr(e.message); store.setSync("err"); }
    setLoading(false);
  };
  useEffect(()=>{ load(); }, []);   // once on mount

  const startGame = async(pz)=>{
    try{ const r = await Api.gameCreate(pz.id); onOpenGame(r.code); }
    catch(e){ setErr(e.message); }
  };
  // One endpoint, two meanings (backend rule): the creator deletes the game for
  // everyone; a non-creator player just leaves it. Confirm before either - a swipe
  // should never fire a bare instant delete.
  const removeGame = async(g, mine)=>{
    const msg = mine
      ? "Delete this game for everyone? Players and progress go with it."
      : "Leave this game? You can rejoin later with the join code.";
    if(!window.confirm(msg)) return;
    setGames(gs=>gs.filter(x=>x.code!==g.code));   // optimistic
    try{ await Api.gameDelete(g.code); }catch(e){ setErr(e.message); }
  };

  return (
    <div>
      <h1 className="screen-title">Your games</h1>
      {err && <div className="banner warn">{err}</div>}

      {loading ? <div className="empty">Loading...</div> : (
        games.length===0 ? (
          <div className="empty">
            <div className="big">&#9633;</div>
            <p>No games yet. Start one from a puzzle below and invite your family.</p>
          </div>
        ) : games.map(g=>{
          const mine = !!(store.authUserId && g.created_by === store.authUserId);
          return (
            <SwipeRow key={g.code} label={mine ? "Delete" : "Leave"} onAction={()=>removeGame(g, mine)}>
              <div className="item" onClick={()=>onOpenGame(g.code)}>
                <div className="avatar" style={{background:colorFor(g.code)}}>{initials(g.title||"C")}</div>
                <div className="grow">
                  <div className="t">{g.title || "Untitled puzzle"}</div>
                  <div className="byline">{g.constructor ? "by "+g.constructor+" - " : ""}{g.status}</div>
                </div>
                <span className="pill accent">{g.code}</span>
              </div>
            </SwipeRow>
          );
        })
      )}

      <div className="row" style={{justifyContent:"space-between",margin:"22px 2px 10px"}}>
        <h2 style={{fontSize:20}}>Puzzle library</h2>
        <button className="btn ghost sm" onClick={()=>go("build")}>Make one</button>
      </div>
      {puzzles.length===0 ? (
        <div className="card"><p className="muted" style={{margin:0}}>
          No puzzles yet. The builder (Step 2) will fill this - or seed one from the backend.
        </p></div>
      ) : puzzles.map(p=>(
        <div key={p.id} className="item" onClick={()=>onSolo(p.id)}>
          <div className="avatar" style={{background:colorFor(p.id)}}>{initials(p.title||"P")}</div>
          <div className="grow">
            <div className="t">{p.title || "Untitled"}</div>
            <div className="byline">by {p.constructor || "unknown"} - {p.license}</div>
          </div>
          <button className="btn sm" onClick={(e)=>{ e.stopPropagation(); startGame(p); }}>Together</button>
        </div>
      ))}
    </div>
  );
}

/* ============================================================
   SOLVE - opens a game (Step 1: shows shared state; grid = Step 2)
   ============================================================ */
function GameView({ code, store, onBack }){
  const [g,setG] = useState(null);
  const [err,setErr] = useState("");
  const [inviteU,setInviteU] = useState("");
  const [msg,setMsg] = useState("");
  const [invErr,setInvErr] = useState("");

  const load = useCallback(async()=>{
    setErr("");
    try{ const d = await Api.gameGet(code); setG(d); }
    catch(e){ setErr(e.message); }
  },[code]);
  useEffect(()=>{ load(); },[load]);

  const invite = async()=>{
    setMsg(""); setInvErr("");
    try{ await Api.gameInvite(code, inviteU); setInviteU(""); setMsg("Invited."); load(); }
    catch(e){ setInvErr(e.message || "Could not send that invite. Try again."); }
  };

  const isCreator = !!(g && store.authUserId && g.created_by === store.authUserId);

  return (
    <div>
      <button className="btn ghost sm" onClick={onBack}>&larr; All games</button>
      <h1 className="screen-title" style={{marginTop:8}}>{g?.puzzle?.title || "Game"}</h1>
      {err && <div className="banner warn">{err}</div>}
      {!g ? <div className="empty">Loading...</div> : (
        <div>
          <div className="card">
            <div className="row" style={{justifyContent:"space-between"}}>
              <div>
                <div className="byline">Join code</div>
                <div style={{fontSize:26,fontFamily:"Fraunces,serif",fontWeight:700,letterSpacing:2}}>{g.code}</div>
              </div>
              <span className="pill accent">{g.status}</span>
            </div>
            {g.puzzle?.constructor && <div className="byline" style={{marginTop:8}}>by {g.puzzle.constructor}</div>}
          </div>

          <div className="card" style={{textAlign:"center"}}>
            <div className="grid-preview" style={{width:150}}>
              <i/><i className="blk"/><i/><i/><i className="blk"/>
              <i className="blk"/><i/><i/><i className="blk"/><i/>
              <i/><i/><i className="blk"/><i/><i/>
              <i/><i className="blk"/><i/><i/><i/>
              <i className="blk"/><i/><i/><i className="blk"/><i/>
            </div>
            <p className="hint" style={{marginTop:14,marginBottom:0}}>
              The solving grid arrives in Step 2. The shared state below is already live.
            </p>
          </div>

          <div className="card">
            <h3>Players ({(g.players||[]).length})</h3>
            {(g.players||[]).map(p=>(
              <div key={p.user_id} className="row" style={{margin:"8px 0"}}>
                <div className="avatar" style={{width:28,height:28,fontSize:12,background:p.color||colorFor(p.user_id)}}>{initials(p.display)}</div>
                <span>{p.display||"Player"}</span>
              </div>
            ))}
            {isCreator ? (
              <div className="row" style={{marginTop:10}}>
                <input className="field" style={{marginTop:0}} placeholder="invite by username"
                  value={inviteU} onChange={e=>setInviteU(e.target.value)} />
                <button className="btn sm primary" onClick={invite} disabled={!inviteU.trim()}>Invite</button>
              </div>
            ) : (
              <p className="hint" style={{marginTop:10,marginBottom:0}}>
                Ask the game creator to invite players, or share the join code above.
              </p>
            )}
            {isCreator && <p className="hint" style={{marginTop:8,marginBottom:0}}>
              You can invite people from your Friends list (accepted connections).
            </p>}
            {msg && <div className="ok">{msg}</div>}
            {invErr && <div className="banner warn" style={{marginTop:10,marginBottom:0}}>{invErr}</div>}
          </div>

          <div className="card">
            <h3>Filled cells ({(g.cells||[]).length})</h3>
            <p className="hint" style={{margin:0}}>
              {(g.cells||[]).length===0 ? "Nothing filled yet - this is the shared per-cell state the grid will write to."
                : "Shared fill is syncing per cell."}
            </p>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================================================
   BUILD - placeholder for the builder (Step 2/3)
   ============================================================ */
function Build(){
  return (
    <div>
      <h1 className="screen-title">Build a puzzle</h1>
      <div className="card">
        <h3>The builder is coming next</h3>
        <p className="muted">This is where the magic happens: design a grid, get smart fill
          suggestions from an open wordlist, and one-tap AI clue help. Family puzzles made
          for each other - the heart of Crossmate.</p>
        <p className="hint">Planned: grid editor - Spread the Wordlist autofill - AI clue-assist - export to your library.</p>
      </div>
    </div>
  );
}

/* ============================================================
   FRIENDS - connections + profile (LIVE against the backend)
   ============================================================ */
function Friends({ store }){
  const [conn,setConn] = useState({connections:[],incoming:[],outgoing:[]});
  const [err,setErr] = useState("");
  const [addU,setAddU] = useState("");
  const [busy,setBusy] = useState(false);
  const needsHandle = !store.profile || !store.profile.username;

  const load = useCallback(async()=>{
    setErr("");
    try{ setConn(await Api.connections()); }
    catch(e){ setErr(e.message); }
  },[]);
  useEffect(()=>{ if(!needsHandle) load(); },[load,needsHandle]);

  const add = async()=>{
    setErr(""); setBusy(true);
    try{ await Api.connectRequest(addU); setAddU(""); await load(); }
    catch(e){ setErr(e.message); }
    setBusy(false);
  };
  const accept = async(id)=>{ try{ await Api.connectAccept(id); load(); }catch(e){ setErr(e.message); } };
  const remove = async(id)=>{ try{ await Api.connectRemove(id); load(); }catch(e){ setErr(e.message); } };
  // Swipe-remove on an accepted buddy confirms first (no bare instant delete).
  const removeBuddy = (c)=>{
    const who = c.display_name || ("@"+(c.username||"?"));
    if(!window.confirm("Remove "+who+" from your connections?")) return;
    remove(c.id);
  };

  if(needsHandle) return (
    <div>
      <h1 className="screen-title">Friends</h1>
      <div className="card">
        <h3>Claim a username first</h3>
        <p className="muted">People add you by your username. Set one in Settings to start connecting.</p>
      </div>
    </div>
  );

  const Person = ({c, action}) => (
    <div className="item" style={{cursor:"default"}}>
      <div className="avatar" style={{background:colorFor(c.user_id)}}>{initials(c.display_name||c.username)}</div>
      <div className="grow">
        <div className="t">{c.display_name || ("@"+(c.username||"?"))}</div>
        {c.display_name && <div className="byline">@{c.username}</div>}
      </div>
      {action}
    </div>
  );

  return (
    <div>
      <h1 className="screen-title">Friends</h1>
      {err && <div className="banner warn">{err}</div>}

      <div className="card">
        <label className="lbl">Add by username</label>
        <div className="row">
          <input className="field" value={addU} onChange={e=>setAddU(e.target.value)} placeholder="username" />
          <button className="btn sm primary" onClick={add} disabled={busy || !addU.trim()}>Add</button>
        </div>
      </div>

      {conn.incoming.length>0 && <>
        <h2 style={{fontSize:18,margin:"16px 2px 8px"}}>Requests</h2>
        {conn.incoming.map(c=><Person key={c.id} c={c} action={
          <div className="row">
            <button className="btn sm primary" onClick={()=>accept(c.id)}>Accept</button>
            <button className="btn sm" onClick={()=>remove(c.id)}>Decline</button>
          </div>} />)}
      </>}

      <h2 style={{fontSize:18,margin:"16px 2px 8px"}}>Your crossword buddies</h2>
      {conn.connections.length===0 ? (
        <div className="empty"><div className="big">&#128101;</div><p>No connections yet. Add family by username above.</p></div>
      ) : conn.connections.map(c=>(
        <SwipeRow key={c.id} label="Remove" onAction={()=>removeBuddy(c)}>
          <Person c={c} />
        </SwipeRow>
      ))}

      {conn.outgoing.length>0 && <>
        <h2 style={{fontSize:18,margin:"16px 2px 8px"}}>Pending</h2>
        {conn.outgoing.map(c=><Person key={c.id} c={c} action={
          <button className="btn sm ghost" onClick={()=>remove(c.id)}>Cancel</button>} />)}
      </>}
    </div>
  );
}

/* ============================================================
   SETTINGS - profile, sign out, diagnostics, version
   ============================================================ */
function Settings({ store, toast, onCheckUpdate, updMsg, update, onApplyUpdate }){
  const [username,setUsername] = useState(store.profile?.username || "");
  const [display,setDisplay] = useState(store.profile?.display_name || "");
  const [msg,setMsg] = useState(""); const [err,setErr] = useState("");
  const [showLog,setShowLog] = useState(false);

  const save = async()=>{
    setMsg(""); setErr("");
    try{ await store.saveProfile(username, display); setMsg("Saved."); toast("Profile saved"); }
    catch(e){ setErr(e.message); }
  };

  return (
    <div>
      <h1 className="screen-title">Settings</h1>
      <div className="card">
        <h3>Your profile</h3>
        <label className="lbl">Username <span className="hint">(how family adds you)</span></label>
        <input className="field" value={username} onChange={e=>setUsername(e.target.value)} placeholder="e.g. chrisg" />
        <div style={{height:10}} />
        <label className="lbl">Display name</label>
        <input className="field" value={display} onChange={e=>setDisplay(e.target.value)} placeholder="Chris" />
        {err && <div className="err">{err}</div>}
        {msg && <div className="ok">{msg}</div>}
        <div style={{height:12}} />
        <button className="btn primary block" onClick={save}>Save profile</button>
      </div>

      <div className="card">
        <div className="row" style={{justifyContent:"space-between"}}>
          <div><div className="t">{store.authEmail}</div><div className="byline">Signed in</div></div>
          <button className="btn sm" onClick={async()=>{ await store.signOut(); toast("Signed out"); }}>Sign out</button>
        </div>
      </div>

      <div className="card">
        <div className="row" style={{justifyContent:"space-between"}}>
          <span className="muted">Diagnostics</span>
          <button className="btn ghost sm" onClick={()=>setShowLog(v=>!v)}>{showLog?"Hide":"Show"} log</button>
        </div>
        {showLog && <div className="diag" style={{marginTop:10}}>
          {LOG.map((l,i)=><div key={i}>{l.t} [{l.tag}] {l.msg}</div>)}
        </div>}
      </div>

      <div className="updrow">
        {update
          ? <button className="btn primary sm" style={{margin:0}} onClick={()=>onApplyUpdate && onApplyUpdate()}>Update to v{update.ver||update.build}</button>
          : <button className="btn ghost sm" style={{margin:0}} onClick={()=>onCheckUpdate && onCheckUpdate(true)}>Check for updates</button>}
        {updMsg && <span className="hint" style={{margin:0}}>{updMsg}</span>}
      </div>
      <p className="hint" style={{textAlign:"center",marginTop:6}}>Crossmate v{APP_VERSION}</p>
    </div>
  );
}

/* ============================================================
   APP ROOT
   ============================================================ */
function App(){
  const store = useStore();
  const [tab,setTab] = useState("home");
  const [openCode,setOpenCode] = useState(null);
  const [soloId,setSoloId] = useState(null);
  const [toastMsg,setToastMsg] = useState("");
  const toast = (m)=>{ setToastMsg(m); setTimeout(()=>setToastMsg(""),1800); };

  // Warm the (possibly sleeping) backend the instant the app opens - even before
  // sign-in - so the first real request isn't a cold start.
  useEffect(()=>{ warmBackend(); }, []);

  // --- PWA self-update: detect a newer deployed build and offer a one-tap refresh ---
  // Installed PWAs cache the HTML hard; this fetches the deployed file fresh, reads its
  // BUILD stamp, and surfaces a banner when a genuinely newer build is live.
  // (No service worker in Crossmate by design, so "apply" is a cache-busted reload.)
  const [update,setUpdate]=useState(null);   // { ver, build } of a newer deployed build, else null
  const [updMsg,setUpdMsg]=useState("");     // inline status for the Settings "Check for updates" row
  const updTimer = useRef(null);
  // Show a status line for a few seconds then clear it (used for terminal results).
  const flashUpd = useCallback((msg)=>{ setUpdMsg(msg); if(updTimer.current) clearTimeout(updTimer.current); updTimer.current = setTimeout(()=>setUpdMsg(""), 4000); },[]);
  // manual=true is the Settings button: show inline "Checking..." then a result. On
  // launch/resume we check quietly and only surface the banner if there's an update.
  // Detection compares the deployed BUILD (monotonic date stamp) so it never misfires;
  // the deployed APP_VERSION is read alongside it purely to LABEL the update ("v0.3.5").
  const checkUpdate = useCallback(async (manual=false)=>{
    if(manual){ if(updTimer.current) clearTimeout(updTimer.current); setUpdMsg("Checking..."); }
    try{
      const res = await fetch(location.pathname + "?_=" + Date.now(), { cache:"no-store" });
      if(!res.ok){ log("UPDATE","check http "+res.status); if(manual) flashUpd("Couldn't check - are you online?"); return; }
      const html = await res.text();
      const mb = html.match(/const BUILD = "([^"]+)";/);       const rBuild = mb && mb[1];
      const mv = html.match(/const APP_VERSION = "([^"]+)";/); const rVer = mv && mv[1];
      if(rBuild && buildIsNewer(rBuild, BUILD)){ log("UPDATE","newer build live: "+rBuild+" (v"+(rVer||"?")+")"); setUpdate({ ver:rVer, build:rBuild }); if(manual) setUpdMsg(""); }
      else { log("UPDATE","up to date (v"+APP_VERSION+", "+BUILD+")"); setUpdate(null); if(manual) flashUpd("You're on the latest (v"+APP_VERSION+")"); }
    }catch(e){ log("UPDATE","check failed: "+e.message); if(manual) flashUpd("Update check failed"); }
  },[flashUpd]);
  // Check on launch AND on resume AND on a periodic timer - installed PWAs are usually
  // RESUMED from the background, not cold-launched, so a launch-only check means the
  // banner rarely surfaces on its own. Debounced so a burst of resumes only refetches once.
  useEffect(()=>{
    let last=0; const GAP=60*1000;
    const maybe=()=>{ const now=Date.now(); if(now-last<GAP) return; last=now; checkUpdate(false); };
    const t=setTimeout(maybe, 1200);                       // initial launch check
    const onVis=()=>{ if(document.visibilityState==="visible") maybe(); };
    document.addEventListener("visibilitychange", onVis);
    const iv=setInterval(maybe, 20*60*1000);               // periodic while open
    return ()=>{ clearTimeout(t); clearInterval(iv); document.removeEventListener("visibilitychange", onVis); };
  },[checkUpdate]);
  // Apply by navigating to a build-stamped URL so iOS can't serve the cached HTML.
  // No service worker here, so a cache-busted replace is the whole story.
  function applyUpdate(){
    const stamp=(update&&update.build)||String(Date.now());
    log("UPDATE","applying -> "+stamp);
    window.location.replace(location.pathname + "?u=" + encodeURIComponent(stamp));
  }

  if(!store.authReady) return <div className="empty" style={{marginTop:80}}>Loading...</div>;
  if(!store.authed) return <AuthScreen store={store} />;

  const openGame = (code)=>{ setOpenCode(code); setTab("solve"); };
  const syncCls = store.sync==="ok"?"ok":store.sync==="pending"?"pending":store.sync==="err"?"err":"";

  return (
    <div className="app">
      {update &&
        <button className="update-bar" onClick={applyUpdate}>
          <span>Update available <b>(v{update.ver||update.build})</b></span>
          <span className="update-go">Refresh</span>
        </button>}
      <div className="topbar">
        <span className="brand"><Mark/> Crossmate</span>
        <span className="spacer" />
        <span className={"syncdot "+syncCls}><i/>{store.online ? (store.sync==="err"?"sync error":store.sync==="syncing"?"syncing":"synced") : "offline"}</span>
      </div>

      <div className="main">
        {tab==="home"  && <Home store={store} onOpenGame={openGame} onSolo={setSoloId} go={setTab} />}
        {tab==="solve" && (openCode
          ? <GameView code={openCode} store={store} onBack={()=>{ setOpenCode(null); setTab("home"); }} />
          : <div className="empty" style={{marginTop:40}}><div className="big">&#9998;</div><p>Open a game from Home to solve.</p></div>)}
        {tab==="build"   && <Build />}
        {tab==="friends" && <Friends store={store} />}
        {tab==="settings"&& <Settings store={store} toast={toast} onCheckUpdate={checkUpdate} updMsg={updMsg} update={update} onApplyUpdate={applyUpdate} />}
      </div>

      <div className="nav">
        {[["home","Home","⌂"],["solve","Solve","✎"],["build","Build","▦"],["friends","Friends","\u{1F465}"],["settings","You","⚙"]].map(([k,label,ic])=>(
          <button key={k} className={tab===k?"active":""} onClick={()=>{ if(k!=="solve") setOpenCode(null); setTab(k); }}>
            <span className="ni">{ic}</span>{label}
          </button>
        ))}
      </div>

      {toastMsg && <div className="toast">{toastMsg}</div>}
      {soloId && <SoloSolve puzzleId={soloId} onBack={()=>setSoloId(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
